<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Calculadora</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Calculadora</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="calculator-container">
    <ion-item>
      <ion-input label="Número 1" type="number" [(ngModel)]="numero1"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Número 2" type="number" [(ngModel)]="numero2"></ion-input>
    </ion-item>

    <ion-item>
      <ion-select label="Operación" [(ngModel)]="operacion">
        <ion-select-option value="sumar">Sumar</ion-select-option>
        <ion-select-option value="restar">Restar</ion-select-option>
        <ion-select-option value="multiplicar">Multiplicar</ion-select-option>
        <ion-select-option value="dividir">Dividir</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-button class="calc-button ion-margin-top" size="small" (click)="calcular()">Calcular</ion-button>

    <ion-item lines="none" class="ion-margin-top">
      <ion-label>
        <strong>Resultado:</strong> {{ resultado }}
      </ion-label>
    </ion-item>

    <ion-item-divider>
      <ion-label>Historial</ion-label>
      <ion-button slot="end" fill="clear" (click)="limpiarHistorial()">Limpiar historial</ion-button>
    </ion-item-divider>

    <ion-list>
      <ion-item *ngFor="let item of historial">
        <ion-label>{{ item }}</ion-label>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
