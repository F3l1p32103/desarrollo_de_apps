<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Componentes de Ionic</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Componentes de Ionic</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    <ion-item *ngFor="let comp of components" [routerLink]="['/component-demo', comp.id]" button detail>
      <ion-icon [src]="comp.icon" slot="start" color="primary"></ion-icon>
      <ion-label>
        <h2>{{ comp.name }}</h2>
        <p>{{ comp.description }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
